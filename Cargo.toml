[package]
name = "taustash"
version = "1.0.0"
edition = "2024"

[package.metadata.bundle]
name = "TauStash"
identifier = "com.him049.taustash"
icon = ["assets/AppIcon.icns"]
resources = ["LICENSE"]
category = "Productivity"
short_description = "A tag-based file collection manager."

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace]
members = ["migration"]

[dependencies]
anyhow = "1.0"
gpui-kit = "0.7.0"
sea-orm = { version = "2.0.3", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono", "with-json"] }
tokio = { version = "1.40", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v7", "serde"] }
blake3 = "1.8.7"
mime_guess = "2.0.5"
walkdir = "2.5"
log = "0.4.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "registry"] }
gpui-fps = "0.7.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "ico", "tiff"] }
infer = "0.22"
rust-i18n = "4.2"
dirs = "6"
sys-locale = "0.3"
gpui-pre-reqwest-client = "=0.3.7"
semver = "1"
futures = "0.3"
migration = { path = "migration", default-features = false }

[build-dependencies]
winres = "0.1.12"
