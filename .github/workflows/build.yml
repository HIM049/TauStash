name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x86_64

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Windows artifact
        shell: pwsh
        run: |
          $stage = "dist/TauStash-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/taustash.exe, LICENSE -Destination $stage

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TauStash-windows-x86_64
          path: dist/TauStash-windows-x86_64
          retention-days: 15
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-arm64

      - name: Install cargo-bundle
        run: |
          if ! cargo bundle --version 2>/dev/null | grep -Fq "cargo-bundle v0.11.0"; then
            cargo install cargo-bundle --version 0.11.0 --locked --force
          fi

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package macOS DMG
        run: bash scripts/package-macos.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TauStash-macos-arm64
          path: target/release/bundle/dmg/TauStash.dmg
          retention-days: 15
          if-no-files-found: error

  linux:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            imagemagick \
            libfontconfig1-dev \
            libfreetype6-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            patchelf \
            pax-utils \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x86_64-ubuntu-22.04

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Linux AppImage
        run: bash scripts/package-linux.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: TauStash-linux-x86_64
          path: target/release/bundle/appimage/TauStash-linux-x86_64.AppImage
          retention-days: 15
          if-no-files-found: error
